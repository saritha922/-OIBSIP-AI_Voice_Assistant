<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Voice Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <div class="robot">🤖</div>

            <h1>AI Voice Assistant</h1>

            <p>Ask anything using your voice 🎤</p>

        </div>


        <!-- Navigation Buttons -->

        <div class="navigation">

            <button id="historyButton">
                📜 History
            </button>

        </div>


        <!-- ========================= -->
        <!-- MAIN HOME CONTENT -->
        <!-- ========================= -->

        <div id="mainContent">

            <!-- Voice Section -->

            <div class="voice-section">

                <button id="micButton" class="mic-button">
                    🎤
                </button>

                <p id="status">
                    Click the microphone and speak
                </p>

            </div>


            <!-- Conversation -->

            <div class="conversation">

                <!-- User Question -->

                <div class="message user-message">

                    <div class="message-title">
                        👤 You
                    </div>

                    <div id="userText">
                        Your question will appear here...
                    </div>

                </div>


                <!-- AI Answer -->

                <div class="message ai-message">

                    <div class="message-title">
                        🤖 AI Assistant
                    </div>

                    <div id="aiText">
                        Your AI answer will appear here...
                    </div>

                </div>

            </div>


            <!-- Back Button After Answer -->

            <button id="answerBackButton" style ="display:none;">
                ⬅️ Back to Home
            </button>

        </div>


        <!-- ========================= -->
        <!-- HISTORY CONTENT -->
        <!-- ========================= -->

        <div id="historyContent" style="display: none;">

            <div class="conversation">

                <div class="message ai-message">

                    <div class="message-title">
                        📜 Conversation History
                    </div>


                    <div id="historyList">

                        No conversations yet.

                    </div>


                    <br>


                    <!-- Back From History -->

                    <button id="historyBackButton">
                        ⬅️ Back to Home
                    </button>

                </div>

            </div>

        </div>


        <!-- Footer -->

        <div class="footer">

            <p>
                ✨ Powered by Gemini AI
            </p>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
